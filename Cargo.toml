[workspace]
resolver = "2"
members = [
    "crates/desigma-doc",
    "crates/desigma-render",
    "crates/desigma-fonts",
    "crates/desigma-fig",
    "crates/desigma-library",
    "crates/desigma-app",
    "crates/desigma-diff",
    "crates/desigma-export",
    "crates/desigma-svg",
    "crates/desigma-gpu",
    "crates/desigma-mcp",
    "crates/desigma-cityos-catalog",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deepfounder-ai/desigma"

[workspace.dependencies]
desigma-doc = { path = "crates/desigma-doc" }
desigma-render = { path = "crates/desigma-render" }
desigma-fig = { path = "crates/desigma-fig" }
desigma-library = { path = "crates/desigma-library" }
desigma-fonts = { path = "crates/desigma-fonts" }
desigma-export = { path = "crates/desigma-export" }
desigma-svg = { path = "crates/desigma-svg" }
desigma-gpu = { path = "crates/desigma-gpu" }
desigma-cityos-catalog = { path = "crates/desigma-cityos-catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev.package."*"]
opt-level = 2
