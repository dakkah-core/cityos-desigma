<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon Browser · Desigma</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">DESIGMA / INCLUDED PLUGIN</p>
    <h1>Icon Browser</h1>
    <p>Choose an icon to insert editable vectors into your open document. Each insertion supports Undo.</p>
    <label for="search">Search included icons</label>
    <input id="search" type="search" placeholder="Try search, clock, or arrow" autocomplete="off" disabled>
    <p id="status" role="status" aria-live="polite">Loading included icons…</p>
    <div id="icons" aria-label="Included icons"></div>
    <footer>12 Lucide icons · Works offline · MIT / ISC licenses included in the installed bundle.</footer>
  </main>
</body>
</html>
